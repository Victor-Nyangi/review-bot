# review-bot's config for its own PRs (format: examples/review-bot.yml).
focus:
  - shell script correctness under `set -euo pipefail` (unset variables, failing pipelines, quoting)
  - GitHub Actions security (script injection via ${{ }} in run blocks, token permissions, pinned actions)
ignore:
  - fixtures/
hide:
  - fixtures/
  - tests/
  - scripts/make-selftest-branch.sh
  - .github/review-bot.yml
extra_rules:
  - Files under sandbox/ are sample applications; review them exactly as you would production application code.
