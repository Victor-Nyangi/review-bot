name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version-pinned release binaries, verified by checksum. shellcheck is
      # installed first so actionlint also checks every `run:` block with it.
      - name: Install shellcheck and actionlint
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "${SHELLCHECK_SHA256}  ${sc}" | sha256sum -c -
          tar -xJf "$sc" && mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/"
          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${ACTIONLINT_SHA256}  ${al}" | sha256sum -c -
          tar -xzf "$al" actionlint && mv actionlint "$bin/"
          echo "$bin" >>"$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh tests/run.sh tests/stubs/gh

  test:
    name: script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests (uses the runner's yq for config parsing)
        run: |
          yq --version || true
          bash tests/run.sh
