# Reviews this repo's PRs with the engine from the PR's own commit, so a change
# to the workflow, scripts or prompts runs before it is tagged. See fixtures/README.md.
name: self-test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/review.yml
    with:
      bot_ref: ${{ github.event.pull_request.head.sha }}
      bot_repo: ${{ github.repository }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
